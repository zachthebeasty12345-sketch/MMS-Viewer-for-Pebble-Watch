plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boxofdanger.mmsviewer'
    compileSdk 36

    defaultConfig {
        applicationId "com.boxofdanger.mmsviewer"
        minSdk 26
        targetSdk 30
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // PebbleKit Android 2
    implementation 'com.github.pebble-dev.PebbleKitAndroid2:client:0.1.0'

    // Old PebbleKit (for data sending)
    implementation 'com.getpebble:pebblekit:4.0.1'

    // Kotlin coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
